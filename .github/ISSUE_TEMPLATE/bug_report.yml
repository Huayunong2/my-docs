name: Bug report
description: 报告一个可以复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，并确保不要粘贴 token、AI Key 或真实个人数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述实际行为和预期行为。
      placeholder: 发生了什么？预期应该怎样？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 列出能够稳定复现问题的最小步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: 例如 master @ abc1234
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - Web / 手机浏览器
        - Web / 桌面浏览器
        - Tauri 桌面端
        - 服务端部署
        - 本地开发
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先删除 token、AI Key、个人数据和公网地址中的敏感部分。
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，并确认这不是重复问题。
          required: true
        - label: 我已移除凭据和个人敏感数据。
          required: true
