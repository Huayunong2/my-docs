name: Feature request
description: 提议一个能够改善项目的功能
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前的痛点、使用场景和受影响的用户。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你希望的行为，也可以附上替代方案和取舍。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个提议符合单用户、自托管和数据自持有的项目定位。
          required: true
        - label: 我已搜索现有 Issue，并确认这不是重复提议。
          required: true
