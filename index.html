<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef2f6" />
    <script>
      (() => {
        try {
          const storage = globalThis.localStorage;
          const mode = storage?.getItem("themeMode");
          const accentTheme = storage?.getItem("accentTheme");
          const isDark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", isDark ? "#11151b" : "#eef2f6");
          if (accentTheme) document.documentElement.dataset.theme = accentTheme;
        } catch {
          // 隐私模式下存储读取失败时由 React 在挂载后接管主题。
        }
      })();
    </script>
    <title>每日总结</title>
    <meta name="description" content="个人日志与知识数据库" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="每日总结" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
